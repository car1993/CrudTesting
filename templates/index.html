<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Flask</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="container mt-5">

    <h1 class="mb-4">Proyecto CRUD Api rest</h1>

    <form action="/add" method="POST" class="mb-4">

        <div class="row">

            <div class="col-md-5">
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Nombre"
                    required>
            </div>

            <div class="col-md-5">
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Correo"
                    required>
            </div>

            <div class="col-md-2">
                <button
                    type="submit"
                    class="btn btn-primary w-100">
                    Guardar
                </button>
            </div>

        </div>

    </form>

    <table class="table table-striped table-hover">

        <thead>

            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>EMAIL</th>
                <th>ACCIONES</th>
            </tr>

        </thead>

        <tbody>

            {% for user in users %}

            <tr>

                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>

                <td>

                    <a
                        href="/edit/{{ user[0] }}"
                        class="btn btn-warning btn-sm">

                        Editar

                    </a>

                    <a
                        href="/delete/{{ user[0] }}"
                        class="btn btn-danger btn-sm">

                        Eliminar

                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>

</html>
